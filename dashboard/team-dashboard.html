<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Dashboard — OnePlace Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="../css/styles.css?v=3.1">
  <link rel="stylesheet" href="../css/dashboard.css?v=3.1">
<base target="_blank">
</head>
<body>
  <div class="dashboard-layout">
    <aside class="dashboard-sidebar" role="navigation" aria-label="Main sidebar"></aside>
    <div class="sidebar-overlay"></div>
    <button class="sidebar-toggle" aria-label="Open menu"><i class="ph ph-list"></i></button>

    <main class="dashboard-main">
      <div class="dashboard-content">
        <div class="page-title-row">
          <div class="dashboard-page-title">
            <h1>Team Performance</h1>
            <p>Track your team's performance across all platforms</p>
          </div>
          <div class="page-controls">
            <button class="date-pill" type="button">
              <span>This Week</span>
              <i class="ph ph-caret-down"></i>
            </button>
            <button class="btn btn-primary" type="button" id="add-member-btn">
              <i class="ph ph-plus"></i> Add Member
            </button>
          </div>
        </div>

        <!-- Team Stats -->
        <div class="exec-stat-grid" id="team-stats"></div>

        <div class="dashboard-grid">
          <!-- Conversations by Platform -->
          <div class="dashboard-col-6">
            <div class="widget-card" style="height: 100%;">
              <div class="widget-header">
                <span class="widget-title">Conversations by Platform</span>
              </div>
              <div class="widget-body">
                <div id="team-platform-chart"></div>
              </div>
            </div>
          </div>

          <!-- Conversations by Status -->
          <div class="dashboard-col-6">
            <div class="widget-card" style="height: 100%;">
              <div class="widget-header">
                <span class="widget-title">Conversations by Status</span>
              </div>
              <div class="widget-body">
                <div id="status-donut-chart"></div>
              </div>
            </div>
          </div>

          <!-- Top Team Members -->
          <div class="dashboard-col-6">
            <div class="widget-card" style="height: 100%;">
              <div class="widget-header">
                <span class="widget-title">Top Team Members</span>
              </div>
              <div class="widget-body">
                <table class="team-table" id="top-team-members"></table>
              </div>
            </div>
          </div>

          <!-- Team Workload -->
          <div class="dashboard-col-6">
            <div class="widget-card" style="height: 100%;">
              <div class="widget-header">
                <span class="widget-title">Team Workload</span>
              </div>
              <div class="widget-body">
                <div id="team-workload"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/app.js?v=3.1"></script>
  <script src="../js/storage.js?v=3.1"></script>
  <script src="../js/dashboard.js?v=3.1"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!OP.nav.requireAuth()) return;

      const app = new DashboardApp();
      const storage = app.storage;

      // Team stat cards (values from the design)
      function renderTeamStats() {
        const metrics = [
          { label: 'Total Team Members', value: '12', trend: 10.5 },
          { label: 'Conversations', value: '1,247', trend: 14.2 },
          { label: 'Resolved', value: '892', trend: 6.3 },
          { label: 'Response Rate', value: '92%', trend: null },
          { label: 'Satisfaction Score', value: '4.7/5', trend: 8.1 }
        ];

        document.getElementById('team-stats').innerHTML = metrics.map(m => `
          <div class="exec-stat-card" style="text-align: left;">
            <div class="exec-stat-label">${m.label}</div>
            <div class="exec-stat-value">${m.value}</div>
            ${m.trend !== null ? `
              <span class="exec-stat-trend ${m.trend >= 0 ? 'up' : 'down'}">
                <i class="ph ${m.trend >= 0 ? 'ph-trend-up' : 'ph-trend-down'}"></i> ${Math.abs(m.trend)}%
              </span>` : ''}
          </div>
        `).join('');
      }

      // Platform bar chart (percent labels per design)
      function renderPlatformChart() {
        app.createBarChart('team-platform-chart', [
          { platform: 'gmail', label: 'Gmail', value: 25, display: '25%' },
          { platform: 'whatsapp', label: 'WhatsApp', value: 23, display: '23%' },
          { platform: 'instagram', label: 'Instagram', value: 18, display: '18%' },
          { platform: 'tiktok', label: 'TikTok', value: 13, display: '13%' },
          { platform: 'x', label: 'X', value: 11, display: '11%' },
          { platform: 'linkedin', label: 'LinkedIn', value: 10, display: '10%' }
        ]);
      }

      // Status donut — 1,247 total per design
      function renderStatusDonut() {
        app.createDonutChart('status-donut-chart', [
          { label: 'Open', value: 374, color: '#3B82F6' },
          { label: 'In Progress', value: 312, color: '#EF4444' },
          { label: 'Pending', value: 312, color: '#A855F7' },
          { label: 'Resolved', value: 249, color: '#22C55E' }
        ], 'Total', { showCounts: true, size: 168, stroke: 24 });
      }

      // Top team members table
      function renderTopTeamMembers() {
        const members = storage.getTeamMembers();
        const rows = members.map(m => `
          <tr>
            <td>
              <div class="team-cell-member">
                <img class="team-photo" src="${m.photo}" alt="${m.name}"
                     onerror="this.outerHTML='<div class=&quot;team-member-avatar&quot; style=&quot;background: ${m.color}&quot;>${m.avatar}</div>'">
                <span class="team-cell-name">${m.name}</span>
              </div>
            </td>
            <td class="num">${m.conversations}</td>
            <td class="num">${m.resolved}</td>
            <td class="num">${m.responseRate}%</td>
            <td><span class="team-rating"><i class="ph ph-star-fill"></i> ${m.rating}</span></td>
          </tr>
        `).join('');

        document.getElementById('top-team-members').innerHTML = `
          <thead>
            <tr>
              <th>Member</th>
              <th>Conversations</th>
              <th>Resolved</th>
              <th>Response Rate</th>
              <th>Rating</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        `;
      }

      // Team workload
      function renderTeamWorkload() {
        const members = storage.getTeamMembers();
        document.getElementById('team-workload').innerHTML = members.map(m => `
          <div class="workload-item">
            <div class="workload-info">
              <img class="team-photo" src="${m.photo}" alt="${m.name}"
                   onerror="this.outerHTML='<div class=&quot;team-member-avatar&quot; style=&quot;background: ${m.color}&quot;>${m.avatar}</div>'">
              <span class="workload-name">${m.name}</span>
            </div>
            <div class="workload-bar"><div class="workload-fill" style="width: ${m.workload}%"></div></div>
            <span class="workload-pct">${m.workload}%</span>
          </div>
        `).join('');
      }

      document.getElementById('add-member-btn').addEventListener('click', () => {
        OP.toast.show('Add member flow would open here', 'info');
      });

      renderTeamStats();
      renderPlatformChart();
      renderStatusDonut();
      renderTopTeamMembers();
      renderTeamWorkload();
    });
  </script>
</body>
</html>
