<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics Dashboard — OnePlace Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="../css/styles.css?v=3.1">
  <link rel="stylesheet" href="../css/dashboard.css?v=3.1">
<base target="_blank">
</head>
<body>
  <div class="dashboard-layout">
    <aside class="dashboard-sidebar" role="navigation" aria-label="Main sidebar"></aside>
    <div class="sidebar-overlay"></div>
    <button class="sidebar-toggle" aria-label="Open menu"><i class="ph ph-list"></i></button>

    <main class="dashboard-main">
      <div class="dashboard-content">
        <div class="page-title-row">
          <div class="dashboard-page-title">
            <h1>Analytics Overview</h1>
            <p>Deep insights across all platforms</p>
          </div>
          <div class="page-controls">
            <button class="date-pill" type="button">
              <i class="ph ph-calendar-blank"></i>
              <span>May 12 - Jun 12, 2024</span>
              <i class="ph ph-caret-down"></i>
            </button>
            <button class="date-pill" type="button" id="export-btn">
              <i class="ph ph-download-simple"></i>
              <span>Export</span>
              <i class="ph ph-caret-down"></i>
            </button>
          </div>
        </div>

        <div class="exec-stat-grid" style="grid-template-columns: repeat(4, 1fr);" id="analytics-stats"></div>

        <div class="dashboard-grid">
          <div class="dashboard-col-6">
            <div class="widget-card" style="height: 100%;">
              <div class="widget-header">
                <span class="widget-title">Conversations Over Time</span>
              </div>
              <div class="widget-body">
                <div class="line-chart-container" id="analytics-area-chart"></div>
              </div>
            </div>
          </div>

          <div class="dashboard-col-6">
            <div class="widget-card" style="height: 100%;">
              <div class="widget-header">
                <span class="widget-title">Conversations by Platform</span>
              </div>
              <div class="widget-body">
                <div id="analytics-donut-chart"></div>
              </div>
            </div>
          </div>

          <div class="dashboard-col-6">
            <div class="widget-card" style="height: 100%;">
              <div class="widget-header">
                <span class="widget-title">Engagement Rate by Platform</span>
              </div>
              <div class="widget-body">
                <div id="engagement-chart"></div>
              </div>
            </div>
          </div>

          <div class="dashboard-col-6">
            <div class="widget-card" style="height: 100%;">
              <div class="widget-header">
                <span class="widget-title">Response Time by Platform (Avg.)</span>
              </div>
              <div class="widget-body">
                <div id="response-chart"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/app.js?v=3.1"></script>
  <script src="../js/storage.js?v=3.1"></script>
  <script src="../js/dashboard.js?v=3.1"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!OP.nav.requireAuth()) return;

      const app = new DashboardApp();
      const storage = app.storage;

      // Stat cards (values from the design)
      function renderStats() {
        const metrics = [
          { label: 'Total Conversations', value: '25,842', trend: 24.6 },
          { label: 'Total Reach', value: '6.45M', trend: 19.8 },
          { label: 'Engagement Rate', value: '8.57%', trend: 11.2 },
          { label: 'Conversion Rate', value: '3.92%', trend: 7.4 }
        ];
        document.getElementById('analytics-stats').innerHTML = metrics.map(m => `
          <div class="exec-stat-card" style="text-align: left;">
            <div class="exec-stat-label">${m.label}</div>
            <div class="exec-stat-value">${m.value}</div>
            <span class="exec-stat-trend up"><i class="ph ph-trend-up"></i> ${m.trend}%</span>
          </div>
        `).join('');
      }

      function renderCharts() {
        // Stacked area chart (deterministic 30-day series)
        const trends = storage.getAreaTrends(30);
        app.createAreaChart('analytics-area-chart', trends, ['linkedin', 'x', 'whatsapp', 'instagram', 'tiktok', 'gmail'], { height: 230 });

        // Donut — 25,842 total per design
        app.createDonutChart('analytics-donut-chart', [
          { label: 'Gmail', value: 5944, color: '#EA4335' },
          { label: 'WhatsApp', value: 5685, color: '#25D366' },
          { label: 'Instagram', value: 4652, color: '#E4405F' },
          { label: 'TikTok', value: 3359, color: '#111827' },
          { label: 'X (Twitter)', value: 3618, color: '#1E3A8A' },
          { label: 'LinkedIn', value: 2584, color: '#0A66C2' }
        ], 'Total', { size: 168, stroke: 24 });

        // Engagement rate bars
        app.createBarChart('engagement-chart', [
          { platform: 'gmail', label: 'Gmail', value: 7.2, display: '7.2%' },
          { platform: 'whatsapp', label: 'WhatsApp', value: 9.8, display: '9.8%' },
          { platform: 'instagram', label: 'Instagram', value: 8.7, display: '8.7%' },
          { platform: 'tiktok', label: 'TikTok', value: 7.4, display: '7.4%' },
          { platform: 'x', label: 'X', value: 6.3, display: '6.3%' },
          { platform: 'linkedin', label: 'LinkedIn', value: 6.1, display: '6.1%' }
        ]);

        // Response time bars
        app.createBarChart('response-chart', [
          { platform: 'gmail', label: 'Gmail', value: 14, display: '14m' },
          { platform: 'whatsapp', label: 'WhatsApp', value: 12, display: '12m' },
          { platform: 'instagram', label: 'Instagram', value: 16, display: '16m' },
          { platform: 'tiktok', label: 'TikTok', value: 19, display: '19m' },
          { platform: 'x', label: 'X', value: 20, display: '20m' },
          { platform: 'linkedin', label: 'LinkedIn', value: 22, display: '22m' }
        ]);
      }

      document.getElementById('export-btn').addEventListener('click', () => {
        OP.toast.show('Report export started', 'info');
      });

      renderStats();
      renderCharts();
    });
  </script>
</body>
</html>
