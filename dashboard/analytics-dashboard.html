<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics Dashboard — OnePlace Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
  <div class="dashboard-layout">
    <aside class="dashboard-sidebar" role="navigation" aria-label="Main sidebar"></aside>
    <div class="sidebar-overlay"></div>
    <button class="sidebar-toggle" aria-label="Open menu"><i class="ph ph-list"></i></button>

    <main class="dashboard-main">
      <header class="dashboard-header" role="banner"></header>

      <div class="dashboard-content">
        <div class="dashboard-page-title">
          <h1>Analytics Overview</h1>
          <p>Deep insights across all platforms</p>
        </div>

        <div class="exec-stat-grid" id="analytics-stats"></div>

        <div class="dashboard-grid">
          <div class="dashboard-col-6">
            <div class="widget-card">
              <div class="widget-header">
                <span class="widget-title">Conversations Over Time</span>
                <div class="widget-actions">
                  <button class="widget-action-btn" title="Export"><i class="ph ph-download-simple"></i></button>
                </div>
              </div>
              <div class="widget-body">
                <div class="line-chart-container" id="analytics-line-chart"></div>
              </div>
            </div>
          </div>

          <div class="dashboard-col-6">
            <div class="widget-card">
              <div class="widget-header">
                <span class="widget-title">Conversations by Platform</span>
              </div>
              <div class="widget-body">
                <div id="analytics-donut-chart"></div>
              </div>
            </div>
          </div>

          <div class="dashboard-col-6">
            <div class="widget-card">
              <div class="widget-header">
                <span class="widget-title">Engagement Rate by Platform</span>
              </div>
              <div class="widget-body">
                <div class="bar-chart-container" id="engagement-chart"></div>
              </div>
            </div>
          </div>

          <div class="dashboard-col-6">
            <div class="widget-card">
              <div class="widget-header">
                <span class="widget-title">Response Time by Platform (Avg.)</span>
              </div>
              <div class="widget-body">
                <div class="bar-chart-container" id="response-chart"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/dashboard.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!OP.nav.requireAuth()) return;
      const app = new DashboardApp();
      const storage = app.storage;

      function renderStats() {
        const stats = storage.getDashboardStats();
        const container = document.getElementById('analytics-stats');
        const metrics = [
          { label: 'Total Conversations', value: stats.totalConversations.toLocaleString(), trend: 24.5 },
          { label: 'Total Reach', value: '6.45M', trend: 18.2 },
          { label: 'Engagement Rate', value: '8.57%', trend: 12.5 },
          { label: 'Conversion Rate', value: '3.92%', trend: 3.8 }
        ];
        container.innerHTML = metrics.map(m => `
          <div class="exec-stat-card">
            <div class="exec-stat-value">${m.value}</div>
            <div class="exec-stat-label">${m.label}</div>
            <span class="exec-stat-trend up"><i class="ph ph-trend-up"></i> ${m.trend}%</span>
          </div>
        `).join('');
      }

      function renderCharts() {
        const trends = storage.getConversationTrends(7);
        app.createLineChart('analytics-line-chart', trends, ['gmail','whatsapp','instagram','tiktok','x','linkedin']);

        const stats = storage.getPlatformStats();
        app.createDonutChart('analytics-donut-chart', [
          { label: 'Gmail', value: stats.gmail.conversations, color: '#EA4335' },
          { label: 'WhatsApp', value: stats.whatsapp.conversations, color: '#25D366' },
          { label: 'Instagram', value: stats.instagram.conversations, color: '#E4405F' },
          { label: 'TikTok', value: stats.tiktok.conversations, color: '#000' },
          { label: 'X', value: stats.x.conversations, color: '#1DA1F2' },
          { label: 'LinkedIn', value: stats.linkedin.conversations, color: '#0A66C2' }
        ], 'Total');

        app.createBarChart('engagement-chart', [
          { platform: 'gmail', label: 'Gmail', value: 72 },
          { platform: 'whatsapp', label: 'WhatsApp', value: 85 },
          { platform: 'instagram', label: 'Instagram', value: 68 },
          { platform: 'tiktok', label: 'TikTok', value: 54 },
          { platform: 'x', label: 'X', value: 61 },
          { platform: 'linkedin', label: 'LinkedIn', value: 45 }
        ]);

        app.createBarChart('response-chart', [
          { platform: 'gmail', label: 'Gmail', value: stats.gmail.avgResponseTime },
          { platform: 'whatsapp', label: 'WhatsApp', value: stats.whatsapp.avgResponseTime },
          { platform: 'instagram', label: 'Instagram', value: stats.instagram.avgResponseTime },
          { platform: 'tiktok', label: 'TikTok', value: stats.tiktok.avgResponseTime },
          { platform: 'x', label: 'X', value: stats.x.avgResponseTime },
          { platform: 'linkedin', label: 'LinkedIn', value: stats.linkedin.avgResponseTime }
        ]);
      }

      renderStats();
      renderCharts();
    });
  </script>
</body>
</html>
