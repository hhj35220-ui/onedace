<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Actions — OnePlace Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="../css/styles.css?v=3.1">
  <link rel="stylesheet" href="../css/dashboard.css?v=3.1">
<base target="_blank">
</head>
<body>
  <div class="dashboard-layout">
    <aside class="dashboard-sidebar" role="navigation" aria-label="Main sidebar"></aside>
    <div class="sidebar-overlay"></div>
    <button class="sidebar-toggle" aria-label="Open menu"><i class="ph ph-list"></i></button>

    <main class="dashboard-main">
      <div class="dashboard-content">
        <div class="page-title-row">
          <div class="dashboard-page-title">
            <h1>Quick Actions</h1>
            <p>Take action across your platforms</p>
          </div>
        </div>

        <div class="dashboard-grid">
          <div class="dashboard-col-12">
            <div class="widget-card">
              <div class="widget-header">
                <span class="widget-title">Message Actions</span>
              </div>
              <div class="widget-body">
                <div class="quick-actions-grid six" id="message-actions"></div>
              </div>
            </div>
          </div>

          <div class="dashboard-col-12">
            <div class="widget-card">
              <div class="widget-header">
                <span class="widget-title">Other Actions</span>
              </div>
              <div class="widget-body">
                <div class="quick-actions-grid six" id="other-actions"></div>
              </div>
            </div>
          </div>

          <div class="dashboard-col-12">
            <div class="widget-card">
              <div class="widget-header">
                <span class="widget-title">Shortcuts</span>
              </div>
              <div class="widget-body">
                <div class="shortcuts-row" id="shortcuts"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/app.js?v=3.1"></script>
  <script src="../js/storage.js?v=3.1"></script>
  <script src="../js/dashboard.js?v=3.1"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!OP.nav.requireAuth()) return;

      const app = new DashboardApp();

      const messageActions = [
        { brand: 'gmail', label: 'Compose Email', toast: 'Compose Gmail email' },
        { brand: 'whatsapp', label: 'Send WhatsApp Message', toast: 'Send WhatsApp message' },
        { brand: 'instagram', label: 'Reply to Instagram DM', toast: 'Reply to Instagram DM' },
        { brand: 'tiktok', label: 'Reply to TikTok Comment', toast: 'Reply to TikTok comment' },
        { brand: 'x', label: 'Reply to X (Twitter) DM / Mention', toast: 'Reply to X message' },
        { brand: 'linkedin', label: 'Reply to LinkedIn Message', toast: 'Reply to LinkedIn message' }
      ];

      const otherActions = [
        { icon: 'ph-user-plus', label: 'Create Contact', toast: 'Create contact' },
        { icon: 'ph-check-square-offset', label: 'Add Task', toast: 'Add task' },
        { icon: 'ph-arrows-clockwise', label: 'Create Deal', toast: 'Create deal' },
        { icon: 'ph-sparkle', label: 'AI Assistant', toast: 'Open AI assistant' },
        { icon: 'ph-file-text', label: 'Generate Report', toast: 'Generate report' },
        { icon: 'ph-megaphone', label: 'Team Broadcast', toast: 'Team broadcast' }
      ];

      const shortcuts = [
        { label: 'All Inbox', href: '../inbox/unified-inbox.html' },
        { label: 'Starred', href: '../inbox/unified-inbox.html?filter=starred' },
        { label: 'Unread', href: '../inbox/unified-inbox.html?filter=unread' },
        { label: 'Assigned to Me', href: '../inbox/unified-inbox.html?filter=assigned' },
        { label: 'Snoozed', href: '../inbox/unified-inbox.html?filter=snoozed' },
        { label: 'Drafts', href: '../inbox/unified-inbox.html?filter=drafts' }
      ];

      document.getElementById('message-actions').innerHTML = messageActions.map((a, i) => `
        <div class="quick-action-card bare" data-kind="msg" data-idx="${i}">
          <div class="quick-action-brand">${app.brandIcon(a.brand, 'glyph', 40)}</div>
          <div class="quick-action-label-sm">${a.label}</div>
        </div>
      `).join('');

      document.getElementById('other-actions').innerHTML = otherActions.map((a, i) => `
        <div class="quick-action-card bare" data-kind="other" data-idx="${i}">
          <div class="quick-action-icon-plain"><i class="ph ${a.icon}"></i></div>
          <div class="quick-action-label-sm">${a.label}</div>
        </div>
      `).join('');

      document.getElementById('shortcuts').innerHTML = shortcuts.map(s => `
        <a class="shortcut-pill" href="${s.href}">${s.label}</a>
      `).join('');

      document.querySelectorAll('.quick-action-card').forEach(card => {
        card.addEventListener('click', () => {
          const list = card.dataset.kind === 'msg' ? messageActions : otherActions;
          OP.toast.show(list[card.dataset.idx].toast, 'info');
        });
      });
    });
  </script>
</body>
</html>
