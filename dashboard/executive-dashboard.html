<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Executive Dashboard — OnePlace Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="../css/styles.css?v=3.1">
  <link rel="stylesheet" href="../css/dashboard.css?v=3.1">
<base target="_blank">
</head>
<body>
  <div class="dashboard-layout">
    <aside class="dashboard-sidebar" role="navigation" aria-label="Main sidebar"></aside>
    <div class="sidebar-overlay"></div>
    <button class="sidebar-toggle" aria-label="Open menu"><i class="ph ph-list"></i></button>

    <main class="dashboard-main">
      <div class="dashboard-content">
        <div class="page-title-row">
          <div class="dashboard-page-title">
            <h1>Executive Overview</h1>
            <p>Business performance across all platforms</p>
          </div>
          <div class="page-controls">
            <button class="date-pill" type="button">
              <i class="ph ph-calendar-blank"></i>
              <span>May 12 - May 18, 2024</span>
              <i class="ph ph-caret-down"></i>
            </button>
          </div>
        </div>

        <!-- Executive Stats -->
        <div class="exec-stat-grid" id="exec-stats"></div>

        <div class="dashboard-grid">
          <!-- Conversations Over Time -->
          <div class="dashboard-col-7">
            <div class="widget-card">
              <div class="widget-header">
                <span class="widget-title">Conversations Over Time</span>
              </div>
              <div class="widget-body">
                <div class="line-chart-container" id="conversations-line-chart"></div>
              </div>
            </div>
          </div>

          <!-- Conversations by Platform -->
          <div class="dashboard-col-5">
            <div class="widget-card">
              <div class="widget-header">
                <span class="widget-title">Conversations by Platform</span>
              </div>
              <div class="widget-body">
                <div id="platform-donut-chart"></div>
              </div>
            </div>
          </div>

          <!-- Top Performing Platform -->
          <div class="dashboard-col-6">
            <div class="widget-card" style="height: 100%;">
              <div class="widget-header">
                <span class="widget-title">Top Performing Platform</span>
              </div>
              <div class="widget-body">
                <div class="top-platforms-grid" id="top-platforms"></div>
              </div>
            </div>
          </div>

          <!-- Response Time by Platform -->
          <div class="dashboard-col-6">
            <div class="widget-card" style="height: 100%;">
              <div class="widget-header">
                <span class="widget-title">Response Time (Avg.) by Platform</span>
              </div>
              <div class="widget-body">
                <div id="response-time-chart"></div>
              </div>
            </div>
          </div>

          <!-- Key Insights -->
          <div class="dashboard-col-12">
            <div class="widget-card">
              <div class="widget-header">
                <span class="widget-title">Key Insights</span>
              </div>
              <div class="widget-body">
                <div class="insights-grid" id="key-insights"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/app.js?v=3.1"></script>
  <script src="../js/storage.js?v=3.1"></script>
  <script src="../js/dashboard.js?v=3.1"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!OP.nav.requireAuth()) return;

      const app = new DashboardApp();
      const storage = app.storage;

      // Executive stat cards (values from the design)
      function renderExecStats() {
        const metrics = [
          { label: 'Total Conversations', value: '8,642', trend: 21.4 },
          { label: 'Engagement Rate', value: '7.82%', trend: 18.6 },
          { label: 'Conversion Rate', value: '3.65%', trend: 9.3 },
          { label: 'Revenue Influenced', value: '$48,250', trend: 15.8 },
          { label: 'Customer Satisfaction', value: '4.7/5', trend: 8.2 }
        ];

        document.getElementById('exec-stats').innerHTML = metrics.map(m => `
          <div class="exec-stat-card" style="text-align: left;">
            <div class="exec-stat-label">${m.label}</div>
            <div class="exec-stat-value">${m.value}</div>
            <span class="exec-stat-trend ${m.trend >= 0 ? 'up' : 'down'}">
              <i class="ph ${m.trend >= 0 ? 'ph-trend-up' : 'ph-trend-down'}"></i> ${Math.abs(m.trend)}%
            </span>
          </div>
        `).join('');
      }

      // Line chart with legend
      function renderLineChart() {
        const trends = storage.getConversationTrends(7);
        app.createLineChart('conversations-line-chart', trends, ['gmail', 'whatsapp', 'instagram', 'tiktok', 'x', 'linkedin'], { height: 230 });
      }

      // Donut — 8,642 total per design
      function renderDonutChart() {
        const stats = storage.getPlatformStats();
        const data = [
          { label: 'Gmail', value: stats.gmail?.conversations || 0, color: '#EA4335' },
          { label: 'WhatsApp', value: stats.whatsapp?.conversations || 0, color: '#25D366' },
          { label: 'Instagram', value: stats.instagram?.conversations || 0, color: '#E4405F' },
          { label: 'TikTok', value: stats.tiktok?.conversations || 0, color: '#111827' },
          { label: 'X (Twitter)', value: stats.x?.conversations || 0, color: '#1E3A8A' },
          { label: 'LinkedIn', value: stats.linkedin?.conversations || 0, color: '#0A66C2' }
        ].filter(d => d.value > 0);

        app.createDonutChart('platform-donut-chart', data, 'Total', { size: 168, stroke: 24 });
      }

      // Top performing platforms (4 columns per design)
      function renderTopPlatforms() {
        const platforms = [
          { key: 'whatsapp', conversations: 2073, trend: 28.6 },
          { key: 'gmail', conversations: 1856, trend: 22.1 },
          { key: 'instagram', conversations: 1432, trend: 18.3 },
          { key: 'x', conversations: 1432, trend: 18.3 }
        ];

        document.getElementById('top-platforms').innerHTML = platforms.map(p => `
          <div class="top-platform-item">
            ${app.brandIcon(p.key, 'glyph', 34)}
            <div class="tp-value">${p.conversations.toLocaleString()}</div>
            <div class="tp-label">Conversations</div>
            <span class="stat-trend up"><i class="ph ph-trend-up"></i> ${p.trend}%</span>
          </div>
        `).join('');
      }

      // Response time bars (sorted ascending per design)
      function renderResponseTimeChart() {
        app.createBarChart('response-time-chart', [
          { platform: 'whatsapp', label: 'WhatsApp', value: 12, display: '12m' },
          { platform: 'gmail', label: 'Gmail', value: 14, display: '14m' },
          { platform: 'instagram', label: 'Instagram', value: 16, display: '16m' },
          { platform: 'tiktok', label: 'TikTok', value: 19, display: '19m' },
          { platform: 'x', label: 'X', value: 20, display: '20m' },
          { platform: 'linkedin', label: 'LinkedIn', value: 22, display: '22m' }
        ]);
      }

      // Key insights (4 cards per design)
      function renderKeyInsights() {
        const insights = [
          { brand: 'whatsapp', bg: '#E8F5E9', text: '<strong>WhatsApp</strong> has the highest engagement this week.' },
          { brand: 'instagram', bg: '#FCE4EC', text: '<strong>Instagram</strong> conversion increased by 20%.' },
          { brand: 'x', bg: '#E3F2FD', text: '<strong>X (Twitter)</strong> response improved by 18%.' },
          { brand: null, icon: 'ph-currency-dollar', bg: 'var(--primary-50)', color: 'var(--primary-600)', text: '<strong>Revenue influenced</strong> is up 15.8% compared to last week.' }
        ];

        document.getElementById('key-insights').innerHTML = insights.map(i => `
          <div class="insight-item">
            <div class="insight-icon" style="background: ${i.bg}; ${i.color ? `color: ${i.color};` : ''}">
              ${i.brand ? app.brandIcon(i.brand, 'glyph', 18) : `<i class="ph ${i.icon}"></i>`}
            </div>
            <div class="insight-text">${i.text}</div>
          </div>
        `).join('');
      }

      renderExecStats();
      renderLineChart();
      renderDonutChart();
      renderTopPlatforms();
      renderResponseTimeChart();
      renderKeyInsights();
    });
  </script>
</body>
</html>
