<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Feed — OnePlace Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="../css/styles.css?v=3.1">
  <link rel="stylesheet" href="../css/dashboard.css?v=3.1">
<base target="_blank">
</head>
<body>
  <div class="dashboard-layout">
    <aside class="dashboard-sidebar" role="navigation" aria-label="Main sidebar"></aside>
    <div class="sidebar-overlay"></div>
    <button class="sidebar-toggle" aria-label="Open menu"><i class="ph ph-list"></i></button>

    <main class="dashboard-main">
      <div class="dashboard-content">
        <div class="page-title-row">
          <div class="dashboard-page-title">
            <h1>Activity Feed</h1>
            <p>Stay updated with everything happening</p>
          </div>
          <div class="page-controls">
            <button class="date-pill" type="button">
              <i class="ph ph-funnel"></i>
              <span>Filters</span>
              <i class="ph ph-caret-down"></i>
            </button>
          </div>
        </div>

        <div class="dashboard-grid">
          <div class="dashboard-col-8">
            <div class="filter-bar">
              <button class="filter-btn active" data-filter="all">All</button>
              <button class="filter-btn" data-filter="gmail">Gmail</button>
              <button class="filter-btn" data-filter="whatsapp">WhatsApp</button>
              <button class="filter-btn" data-filter="instagram">Instagram</button>
              <button class="filter-btn" data-filter="tiktok">TikTok</button>
              <button class="filter-btn" data-filter="x">X (Twitter)</button>
              <button class="filter-btn" data-filter="linkedin">LinkedIn</button>
            </div>
            <div class="activity-feed-list" id="activity-list"></div>
          </div>

          <div class="dashboard-col-4">
            <div class="widget-card" style="margin-bottom: var(--space-5);">
              <div class="widget-header">
                <span class="widget-title">Activity Summary</span>
              </div>
              <div class="widget-body">
                <div class="summary-section-title">Today</div>
                <div id="activity-summary"></div>
              </div>
            </div>

            <div class="widget-card">
              <div class="widget-header">
                <span class="widget-title">Unread by Platform</span>
              </div>
              <div class="widget-body">
                <div id="unread-summary"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/app.js?v=3.1"></script>
  <script src="../js/storage.js?v=3.1"></script>
  <script src="../js/dashboard.js?v=3.1"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!OP.nav.requireAuth()) return;

      const app = new DashboardApp();
      const storage = app.storage;

      const PLATFORM_LABELS = {
        gmail: 'Gmail', whatsapp: 'WhatsApp', instagram: 'Instagram',
        tiktok: 'TikTok', x: 'X (Twitter)', linkedin: 'LinkedIn'
      };

      function renderActivities() {
        const activities = storage.getActivities(app.currentFilter);
        const container = document.getElementById('activity-list');

        if (activities.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon"><i class="ph ph-bell-slash"></i></div>
              <div class="empty-state-title">No activity</div>
              <div class="empty-state-desc">Nothing here for this platform yet.</div>
            </div>`;
          return;
        }

        container.innerHTML = activities.map(act => `
          <div class="activity-item" data-id="${act.id}">
            <div class="activity-brand">${app.brandIcon(act.platform, 'glyph', 30)}</div>
            <div class="activity-content">
              <div class="activity-title">${act.title}</div>
              <div class="activity-desc">${act.description}</div>
            </div>
            <span class="activity-time">${app.formatClockTime(act.timestamp)}</span>
          </div>
        `).join('');
      }

      function renderSummaries() {
        const stats = storage.getPlatformStats();
        const order = ['gmail', 'whatsapp', 'instagram', 'tiktok', 'x', 'linkedin'];
        let total = 0;

        const rows = order.map(p => {
          const unread = stats[p]?.unread || 0;
          total += unread;
          return `
            <div class="summary-row">
              ${app.brandIcon(p, 'glyph', 20)}
              <span class="summary-name">${PLATFORM_LABELS[p]}</span>
              <span class="summary-value">${unread}</span>
            </div>
          `;
        }).join('');

        document.getElementById('activity-summary').innerHTML = rows + `
          <div class="summary-total"><span>Total</span><span>${total}</span></div>
        `;

        document.getElementById('unread-summary').innerHTML = rows;
      }

      document.addEventListener('dashboard:filter', () => renderActivities());

      renderActivities();
      renderSummaries();
    });
  </script>
</body>
</html>
