<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversations — WhatsApp Business — OnePlace Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/whatsapp.css">
<base target="_blank">
</head>
<body>
  <div class="dashboard-layout">
    <aside class="dashboard-sidebar" role="navigation" aria-label="WhatsApp sidebar"></aside>
    <div class="sidebar-overlay"></div>

    <main class="dashboard-main">
      <header class="dashboard-header" role="banner"></header>

      <div class="whatsapp-layout">
        <div class="whatsapp-sidebar">
          <!-- Rendered by JS -->
        </div>

        <div class="whatsapp-main">
          <div style="padding: var(--space-5) var(--space-6);">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-5);">
              <div>
                <h2 style="font-size: var(--text-2xl); font-weight: var(--font-semibold); color: var(--gray-900);">Conversations</h2>
                <p style="font-size: var(--text-sm); color: var(--gray-500); margin-top: var(--space-1);">Manage all your WhatsApp conversations in one place.</p>
              </div>
              <div style="display: flex; gap: var(--space-3);">
                <button class="btn btn-secondary" id="filter-all">All</button>
                <button class="btn btn-ghost" id="filter-open">Open</button>
                <button class="btn btn-ghost" id="filter-resolved">Resolved</button>
                <button class="btn btn-ghost" id="filter-unread">Unread</button>
              </div>
            </div>

            <div style="background: var(--gray-0); border: 1px solid var(--gray-200); border-radius: var(--radius-xl); box-shadow: var(--shadow-sm);">
              <div style="display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4); border-bottom: 1px solid var(--gray-200);">
                <div style="flex: 1; display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-4); background: var(--gray-100); border-radius: var(--radius-lg);">
                  <i class="ph ph-magnifying-glass" style="color: var(--gray-400);"></i>
                  <input type="text" id="conv-search" placeholder="Search conversations..." style="border: none; background: transparent; outline: none; font-size: var(--text-sm); color: var(--gray-800); width: 100%;">
                </div>
                <select id="label-filter" style="padding: var(--space-2) var(--space-4); border: 1px solid var(--gray-200); border-radius: var(--radius-lg); background: var(--gray-0); color: var(--gray-700); font-size: var(--text-sm);">
                  <option value="">All Labels</option>
                  <option value="customer-support">Customer Support</option>
                  <option value="sales">Sales</option>
                  <option value="order-status">Order Status</option>
                  <option value="returns">Returns</option>
                </select>
                <select id="agent-filter" style="padding: var(--space-2) var(--space-4); border: 1px solid var(--gray-200); border-radius: var(--radius-lg); background: var(--gray-0); color: var(--gray-700); font-size: var(--text-sm);">
                  <option value="">All Agents</option>
                  <option value="tm1">Alex Morgan</option>
                  <option value="tm2">Jake Cooper</option>
                  <option value="tm3">Cody Fisher</option>
                </select>
              </div>
              <div id="conversations-table" style="padding: var(--space-2);">
                <!-- Injected by JS -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/whatsapp.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!OP.nav.requireAuth()) return;

      const waStorage = new WhatsAppStorage();
      const app = new WhatsAppApp();

      // Override to render full conversation table
      function renderTable() {
        const container = document.getElementById('conversations-table');
        const conversations = waStorage.getConversations();

        if (conversations.length === 0) {
          container.innerHTML = `
            <div class="wa-empty-state">
              <div class="wa-empty-state-icon"><i class="ph ph-chat-circle-dots"></i></div>
              <div class="wa-empty-state-title">No conversations</div>
              <div class="wa-empty-state-desc">Start a new conversation to see it here.</div>
            </div>
          `;
          return;
        }

        let html = `
          <table style="width: 100%; border-collapse: collapse;">
            <thead>
              <tr style="border-bottom: 1px solid var(--gray-200);">
                <th style="text-align: left; padding: var(--space-3) var(--space-4); font-size: var(--text-xs); font-weight: var(--font-semibold); color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.5px;">Contact</th>
                <th style="text-align: left; padding: var(--space-3) var(--space-4); font-size: var(--text-xs); font-weight: var(--font-semibold); color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.5px;">Message</th>
                <th style="text-align: left; padding: var(--space-3) var(--space-4); font-size: var(--text-xs); font-weight: var(--font-semibold); color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.5px;">Label</th>
                <th style="text-align: left; padding: var(--space-3) var(--space-4); font-size: var(--text-xs); font-weight: var(--font-semibold); color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.5px;">Status</th>
                <th style="text-align: left; padding: var(--space-3) var(--space-4); font-size: var(--text-xs); font-weight: var(--font-semibold); color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.5px;">Assigned</th>
                <th style="text-align: left; padding: var(--space-3) var(--space-4); font-size: var(--text-xs); font-weight: var(--font-semibold); color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.5px;">Time</th>
                <th style="text-align: right; padding: var(--space-3) var(--space-4); font-size: var(--text-xs); font-weight: var(--font-semibold); color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.5px;">Actions</th>
              </tr>
            </thead>
            <tbody>
        `;

        conversations.forEach(conv => {
          const contact = conv.contact || {};
          const timeAgo = app.formatTimeAgo(conv.timestamp);

          html += `
            <tr style="border-bottom: 1px solid var(--gray-100); transition: background var(--transition-fast);" onmouseover="this.style.background='var(--gray-50)'" onmouseout="this.style.background='transparent'">
              <td style="padding: var(--space-3) var(--space-4);">
                <div style="display: flex; align-items: center; gap: var(--space-3);">
                  <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(contact.name || 'U')}&background=${(contact.color || '#6366f1').replace('#', '')}&color=fff&size=80" 
                       alt="${contact.name}" style="width: 36px; height: 36px; border-radius: var(--radius-full); object-fit: cover;">
                  <div>
                    <div style="font-size: var(--text-sm); font-weight: var(--font-medium); color: var(--gray-900);">${contact.name || 'Unknown'}</div>
                    <div style="font-size: 11px; color: var(--gray-400);">${contact.phone || ''}</div>
                  </div>
                </div>
              </td>
              <td style="padding: var(--space-3) var(--space-4);">
                <div style="font-size: var(--text-sm); color: var(--gray-700); max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${conv.lastMessage || 'No messages'}</div>
              </td>
              <td style="padding: var(--space-3) var(--space-4);">
                ${conv.tag ? `<span class="wa-conv-tag ${conv.tag}">${conv.tag.replace('-', ' ')}</span>` : '<span style="color: var(--gray-400); font-size: var(--text-xs);">—</span>'}
              </td>
              <td style="padding: var(--space-3) var(--space-4);">
                <span style="padding: 2px 8px; border-radius: var(--radius-sm); font-size: 11px; font-weight: var(--font-semibold); text-transform: uppercase;
                  ${conv.status === 'open' ? 'background: var(--success-50); color: var(--success-600);' : 'background: var(--gray-100); color: var(--gray-500);'}">${conv.status}</span>
              </td>
              <td style="padding: var(--space-3) var(--space-4);">
                <div style="display: flex; align-items: center; gap: var(--space-2);">
                  <div style="width: 24px; height: 24px; border-radius: var(--radius-full); background: var(--primary-500); color: white; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: var(--font-bold);">AM</div>
                  <span style="font-size: var(--text-xs); color: var(--gray-600);">Alex Morgan</span>
                </div>
              </td>
              <td style="padding: var(--space-3) var(--space-4);">
                <span style="font-size: var(--text-xs); color: var(--gray-400);">${timeAgo}</span>
              </td>
              <td style="padding: var(--space-3) var(--space-4); text-align: right;">
                <button style="width: 28px; height: 28px; border: none; border-radius: var(--radius-md); background: transparent; color: var(--gray-400); cursor: pointer;" title="View">
                  <i class="ph ph-eye"></i>
                </button>
                <button style="width: 28px; height: 28px; border: none; border-radius: var(--radius-md); background: transparent; color: var(--gray-400); cursor: pointer;" title="More">
                  <i class="ph ph-dots-three-vertical"></i>
                </button>
              </td>
            </tr>
          `;
        });

        html += '</tbody></table>';
        container.innerHTML = html;
      }

      renderTable();

      // Search
      document.getElementById('conv-search').addEventListener('input', (e) => {
        renderTable();
      });

      // Filter buttons
      document.querySelectorAll('[id^="filter-"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('[id^="filter-"]').forEach(b => {
            b.classList.remove('btn-secondary');
            b.classList.add('btn-ghost');
          });
          e.target.classList.remove('btn-ghost');
          e.target.classList.add('btn-secondary');
          renderTable();
        });
      });
    });
  </script>
</body>
</html>
