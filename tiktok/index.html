<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok — OnePlace Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/tiktok.css">
</head>
<body>
  <div class="dashboard-layout">
    <aside class="dashboard-sidebar" role="navigation" aria-label="TikTok sidebar">
      <div class="sidebar-header">
        <a href="../index.html" class="logo">
          <div class="logo-mark"><i class="ph ph-chat-centered-text"></i></div>
          <div class="logo-text"><span class="logo-brand">OnePlace</span><span class="logo-sub">Enterprise</span></div>
        </a>
      </div>
      <nav class="sidebar-nav" aria-label="TikTok navigation" id="tiktokSidebarNav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-user"><div class="sidebar-user-avatar" id="sidebarAvatar">AM</div><div class="sidebar-user-info"><div class="sidebar-user-name">Alex Morgan</div><div class="sidebar-user-role">Admin</div></div></div>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="dashboard-main">
      <header class="dashboard-header" role="banner">
        <div class="header-left">
          <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar"><i class="ph ph-list"></i></button>
          <div class="dashboard-page-title"><h1>TikTok Overview</h1><p>Monitor and engage with your TikTok audience</p></div>
        </div>
        <div class="header-right">
          <div class="header-actions">
            <button class="header-btn" id="exportReport"><i class="ph ph-export"></i> Export</button>
            <div class="header-avatar" id="headerAvatar">AM</div>
          </div>
        </div>
      </header>

      <div class="dashboard-content" id="tiktok-content">
        <!-- Content is rendered by JS -->
      </div>
    </main>
  </div>

  <script>
    window.OP = {
      auth: {
        getSession: () => ({ fullName: 'Alex Morgan', email: 'alex@oneplace.com' }),
        requireAuth: () => true,
        signOut: () => { localStorage.clear(); window.location.href = 'signin.html'; }
      },
      theme: {
        toggle: () => {
          const html = document.documentElement;
          const current = html.getAttribute('data-theme');
          html.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
        }
      },
      toast: {
        show: (msg, type = 'info', duration = 3000) => {
          console.log(`[${type}] ${msg}`);
        }
      },
      loading: { show: () => {}, hide: () => {} },
      nav: { requireAuth: () => true }
    };
  </script>
  <script src="../js/app.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/tiktok.js"></script>
</body>
</html>
