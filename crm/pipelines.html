<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Pipelines — OnePlace Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/crm.css">
</head>
<body>
  <div class="dashboard-layout">
    <aside class="dashboard-sidebar"></aside>
    <div class="sidebar-overlay"></div>
    <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
      <i class="ph ph-list"></i>
    </button>

    <main class="dashboard-main">
      <header class="dashboard-header crm-header">
        <div class="header-left">
          <div class="header-brand">
            <div class="crm-header-icon"><i class="ph ph-users"></i></div>
            <div class="header-brand-text">
              <h1 class="header-title">CRM</h1>
              <p class="header-subtitle">Track your sales pipeline, leads, and customer relationships</p>
            </div>
          </div>
        </div>
        <div class="header-center">
          <div class="header-search crm-search">
            <i class="ph ph-magnifying-glass"></i>
            <input type="text" id="crm-search" placeholder="Search pipelines..." autocomplete="off">
            <span class="search-shortcut">⌘K</span>
          </div>
        </div>
        <div class="header-right">
          <button class="header-btn" id="notifications-btn" aria-label="Notifications">
            <i class="ph ph-bell"></i>
            <span class="notification-dot" id="notif-dot"></span>
          </button>
          <button class="header-btn" id="theme-toggle-header" aria-label="Toggle theme">
            <i class="ph ph-moon"></i>
          </button>
          <div class="header-user">
            <img src="https://ui-avatars.com/api/?name=Alex+Morgan&background=6366f1&color=fff&size=64" alt="Alex Morgan" class="header-avatar-img" id="user-menu-btn">
            <div class="header-user-info">
              <span class="header-user-name">Alex Morgan</span>
              <span class="header-user-role">Admin</span>
            </div>
          </div>
        </div>
      </header>

      <nav class="crm-tabs" aria-label="CRM sections">
        <div class="crm-tabs-inner">
          <a href="index.html" class="crm-tab" data-page="dashboard">
            <i class="ph ph-squares-four"></i>
            <span>Dashboard</span>
          </a>
          <a href="leads.html" class="crm-tab" data-page="leads">
            <i class="ph ph-target"></i>
            <span>Leads</span>
            <span class="tab-badge" id="leads-badge">1,248</span>
          </a>
          <a href="contacts.html" class="crm-tab" data-page="contacts">
            <i class="ph ph-address-book"></i>
            <span>Contacts</span>
            <span class="tab-badge" id="contacts-badge">986</span>
          </a>
          <a href="companies.html" class="crm-tab" data-page="companies">
            <i class="ph ph-buildings"></i>
            <span>Companies</span>
            <span class="tab-badge" id="companies-badge">420</span>
          </a>
          <a href="deals.html" class="crm-tab" data-page="deals">
            <i class="ph ph-handshake"></i>
            <span>Deals</span>
            <span class="tab-badge" id="deals-badge">312</span>
          </a>
          <a href="pipelines.html" class="crm-tab active" data-page="pipelines">
            <i class="ph ph-kanban"></i>
            <span>Pipelines</span>
          </a>
          <a href="opportunities.html" class="crm-tab" data-page="opportunities">
            <i class="ph ph-lightning"></i>
            <span>Opportunities</span>
          </a>
          <a href="settings.html" class="crm-tab" data-page="settings">
            <i class="ph ph-gear"></i>
            <span>Settings</span>
          </a>
        </div>
      </nav>

      <div class="dashboard-content crm-content">
        <div class="crm-pipelines-page">
          <div class="list-toolbar">
            <div class="list-filters">
              <button class="filter-btn active" data-filter="sales">Sales Pipeline</button>
              <button class="filter-btn" data-filter="marketing">Marketing Pipeline</button>
              <button class="filter-btn" data-filter="support">Support Pipeline</button>
            </div>
            <div class="list-actions">
              <button class="btn btn-primary btn-sm" id="add-pipeline-btn"><i class="ph ph-plus"></i> New Pipeline</button>
            </div>
          </div>
          <div class="pipeline-list" id="pipeline-list"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/dashboard.js"></script>
  <script src="../js/crm.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!OP.auth.isAuthenticated()) {
        window.location.href = '../auth/signin.html';
        return;
      }
      window.crmApp = new CRMApp();
      window.crmApp.initPipelinesPage();
    });
  </script>
</body>
</html>
