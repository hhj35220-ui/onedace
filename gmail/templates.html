<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Templates — OnePlace Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/gmail.css">
<base target="_blank">
</head>
<body>
  <div class="gmail-layout">
    <aside class="gmail-sidebar" role="navigation" aria-label="Gmail navigation"></aside>
    <div class="gmail-sidebar-overlay sidebar-overlay"></div>
    <main class="gmail-main" style="margin-right: 0;">
      <header class="gmail-header" role="banner"></header>
      <div class="gmail-content">
        <div class="gmail-page-title">
          <div class="gmail-page-title-left">
            <h1>
              <span class="gmail-icon"><i class="ph ph-files"></i></span>
              Email Templates
            </h1>
            <p>Manage your email templates</p>
          </div>
          <div class="gmail-page-title-right">
            <button class="btn btn-primary" id="new-template-btn"><i class="ph ph-plus"></i> New Template</button>
          </div>
        </div>
        <div class="gmail-templates-grid" id="gmail-templates-grid"></div>
      </div>
    </main>
  </div>
  <script src="../js/app.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/gmail.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!OP.nav.requireAuth()) return;
      window.gmailApp = new GmailApp();
    });
  </script>
</body>
</html>
