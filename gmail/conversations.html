<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gmail Conversations — OnePlace Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/gmail.css">
<base target="_blank">
</head>
<body>
  <div class="gmail-layout">
    <aside class="gmail-sidebar" role="navigation" aria-label="Gmail navigation"></aside>
    <div class="gmail-sidebar-overlay sidebar-overlay"></div>
    <main class="gmail-main" style="margin-right: 0;">
      <header class="gmail-header" role="banner"></header>
      <div class="gmail-content" style="padding: 0;">
        <div class="gmail-conversations-layout">
          <div class="gmail-conversations-list">
            <div class="gmail-conversations-list-header">
              <span class="gmail-conversations-list-title">Conversations</span>
              <span class="gmail-conversations-list-count" id="conversations-count">0</span>
            </div>
            <div class="gmail-conversations-search">
              <input type="text" id="gmail-conversations-search" placeholder="Search conversations...">
            </div>
            <div class="gmail-conversations-filters">
              <button class="gmail-conversations-filter-btn active" data-filter="all">All</button>
              <button class="gmail-conversations-filter-btn" data-filter="unread">Unread</button>
              <button class="gmail-conversations-filter-btn" data-filter="starred">Starred</button>
              <button class="gmail-conversations-filter-btn" data-filter="archived">Archived</button>
            </div>
            <div class="gmail-conversations-items" id="gmail-conversations-list-items"></div>
          </div>
          <div class="gmail-conversation-detail" id="gmail-conversation-detail">
            <div class="empty-state" style="height: 100%; justify-content: center;">
              <div class="empty-state-icon"><i class="ph ph-envelope"></i></div>
              <div class="empty-state-title">Select a conversation</div>
              <div class="empty-state-desc">Choose an email from the list to view details</div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="../js/app.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/gmail.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!OP.nav.requireAuth()) return;
      window.gmailApp = new GmailApp();
    });
  </script>
</body>
</html>
