<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gmail Overview — OnePlace Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/gmail.css">
<base target="_blank">
</head>
<body>
  <div class="gmail-layout">
    <aside class="gmail-sidebar" role="navigation" aria-label="Gmail navigation"></aside>
    <div class="gmail-sidebar-overlay sidebar-overlay"></div>
    <main class="gmail-main">
      <header class="gmail-header" role="banner"></header>
      <div class="gmail-content">
        <div class="gmail-page-title">
          <div class="gmail-page-title-left">
            <h1>
              <span class="gmail-icon"><i class="ph ph-envelope-simple"></i></span>
              Gmail Overview
            </h1>
            <p>Monitor your Gmail performance and account health</p>
          </div>
        </div>
        <div class="gmail-stats-grid" id="gmail-stats"></div>
        <div class="gmail-grid">
          <div class="gmail-col-5">
            <div class="gmail-widget">
              <div class="gmail-widget-header">
                <span class="gmail-widget-title">Email Analytics</span>
                <div class="gmail-widget-actions">
                  <button class="gmail-widget-action-btn" title="This Week"><i class="ph ph-calendar"></i> This Week</button>
                </div>
              </div>
              <div class="gmail-widget-body">
                <div style="display: flex; gap: 16px; margin-bottom: 16px; font-size: 12px;">
                  <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #4F46E5; display: inline-block;"></span> Received</span>
                  <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #10B981; display: inline-block;"></span> Sent</span>
                </div>
                <div class="gmail-chart-container" id="gmail-analytics-chart"></div>
              </div>
            </div>
          </div>
          <div class="gmail-col-4">
            <div class="gmail-widget">
              <div class="gmail-widget-header">
                <span class="gmail-widget-title">Top Email Categories</span>
              </div>
              <div class="gmail-widget-body">
                <div id="gmail-categories-chart"></div>
              </div>
            </div>
          </div>
          <div class="gmail-col-3">
            <div class="gmail-widget">
              <div class="gmail-widget-header">
                <span class="gmail-widget-title">AI Suggestions</span>
                <div class="gmail-widget-actions">
                  <span class="badge badge-primary" style="font-size: 10px; padding: 2px 8px; background: #EEF2FF; color: #4F46E5; border-radius: 4px; font-weight: 600;">BETA</span>
                </div>
              </div>
              <div class="gmail-widget-body">
                <div class="gmail-ai-list" id="gmail-ai-suggestions"></div>
              </div>
            </div>
          </div>
          <div class="gmail-col-5">
            <div class="gmail-widget">
              <div class="gmail-widget-header">
                <span class="gmail-widget-title">Recent Conversations</span>
                <div class="gmail-widget-actions">
                  <a href="conversations.html" class="gmail-widget-action-btn" title="View All"><i class="ph ph-arrow-right"></i></a>
                </div>
              </div>
              <div class="gmail-widget-body">
                <div class="gmail-conversation-list" id="gmail-recent-conversations"></div>
              </div>
            </div>
          </div>
          <div class="gmail-col-4">
            <div class="gmail-widget">
              <div class="gmail-widget-header">
                <span class="gmail-widget-title">Gmail Activity</span>
                <div class="gmail-widget-actions">
                  <a href="conversations.html" class="gmail-widget-action-btn" title="View All"><i class="ph ph-arrow-right"></i></a>
                </div>
              </div>
              <div class="gmail-widget-body">
                <div class="gmail-activity-list" id="gmail-activity"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <aside class="gmail-right-sidebar" id="gmail-account-panel"></aside>
  </div>
  <script src="../js/app.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/gmail.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!OP.nav.requireAuth()) return;
      window.gmailApp = new GmailApp();
    });
  </script>
</body>
</html>
