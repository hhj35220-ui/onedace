<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — OnePlace Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="auth-page page-transition">
    <aside class="auth-sidebar">
      <div class="auth-sidebar-content">
        <div class="logo" style="color: white;">
          <div class="logo-mark"><i class="ph ph-chat-centered-text"></i></div>
          <div class="logo-text">
            <span class="logo-brand">OnePlace</span>
            <span class="logo-sub">Enterprise</span>
          </div>
        </div>
        <div style="margin-top: auto; padding-top: var(--space-20);">
          <h1 class="auth-sidebar-headline">Reset your password</h1>
          <p class="auth-sidebar-subtitle">Create a new secure password for your account.</p>
        </div>
      </div>
      <div class="auth-sidebar-footer">
        <div class="auth-sidebar-trust">
          <i class="ph ph-shield-check"></i>
          <span>Secure password reset</span>
        </div>
      </div>
    </aside>

    <main class="auth-main">
      <div class="auth-container">
        <div class="auth-header">
          <a href="index.html" class="logo" style="margin-bottom: var(--space-6); display: inline-flex;">
            <div class="logo-mark"><i class="ph ph-chat-centered-text"></i></div>
            <div class="logo-text">
              <span class="logo-brand">OnePlace</span>
              <span class="logo-sub">Enterprise</span>
            </div>
          </a>
          <h1 class="auth-title">Reset your password</h1>
          <p class="auth-subtitle">Enter your new password below.</p>
        </div>

        <form id="reset-form" novalidate>
          <!-- New Password -->
          <div class="form-group">
            <label class="form-label" for="newPassword">New password</label>
            <div class="form-input-wrapper">
              <i class="ph ph-lock-key form-input-icon"></i>
              <input 
                type="password" 
                id="newPassword" 
                name="newPassword" 
                class="form-input with-icon with-icon-right" 
                placeholder="Enter new password"
                autocomplete="new-password"
                required
              >
              <button type="button" class="form-input-toggle" id="toggle-new" aria-label="Toggle password visibility">
                <i class="ph ph-eye"></i>
              </button>
            </div>
            <div class="strength-meter" id="strength-meter">
              <div class="strength-segment"></div>
              <div class="strength-segment"></div>
              <div class="strength-segment"></div>
              <div class="strength-segment"></div>
            </div>
            <div class="strength-label" id="strength-label"></div>
            <div class="form-error" id="newPassword-error" style="display: none;"></div>
          </div>

          <!-- Confirm Password -->
          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm password</label>
            <div class="form-input-wrapper">
              <i class="ph ph-lock-key form-input-icon"></i>
              <input 
                type="password" 
                id="confirmPassword" 
                name="confirmPassword" 
                class="form-input with-icon with-icon-right" 
                placeholder="Confirm new password"
                autocomplete="new-password"
                required
              >
              <button type="button" class="form-input-toggle" id="toggle-confirm" aria-label="Toggle password visibility">
                <i class="ph ph-eye"></i>
              </button>
            </div>
            <div class="form-error" id="confirmPassword-error" style="display: none;"></div>
          </div>

          <button type="submit" class="btn btn-primary btn-full btn-lg" id="submit-btn">
            Reset Password
          </button>
        </form>

        <div class="auth-footer">
          <a href="signin.html" style="display: inline-flex; align-items: center; gap: var(--space-2);">
            <i class="ph ph-arrow-left"></i> Back to sign in
          </a>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/app.js?v=20260803-1"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');

      if (!token) {
        OP.toast.show('Invalid reset link.', 'error');
        setTimeout(() => window.location.href = 'forgot-password.html', 2000);
        return;
      }

      const form = document.getElementById('reset-form');
      const newPasswordInput = document.getElementById('newPassword');
      const confirmPasswordInput = document.getElementById('confirmPassword');
      const submitBtn = document.getElementById('submit-btn');
      const strengthMeter = document.getElementById('strength-meter');
      const strengthLabel = document.getElementById('strength-label');

      // Toggle visibility
      document.getElementById('toggle-new').addEventListener('click', () => {
        const isPassword = newPasswordInput.type === 'password';
        newPasswordInput.type = isPassword ? 'text' : 'password';
        document.getElementById('toggle-new').innerHTML = isPassword ? '<i class="ph ph-eye-slash"></i>' : '<i class="ph ph-eye"></i>';
      });

      document.getElementById('toggle-confirm').addEventListener('click', () => {
        const isPassword = confirmPasswordInput.type === 'password';
        confirmPasswordInput.type = isPassword ? 'text' : 'password';
        document.getElementById('toggle-confirm').innerHTML = isPassword ? '<i class="ph ph-eye-slash"></i>' : '<i class="ph ph-eye"></i>';
      });

      // Password strength
      newPasswordInput.addEventListener('input', () => {
        const strength = OP.validator.checkStrength(newPasswordInput.value);
        const segments = strengthMeter.querySelectorAll('.strength-segment');
        segments.forEach((seg, i) => {
          seg.className = 'strength-segment';
          if (i < strength.score) seg.classList.add(strength.class);
        });
        strengthLabel.textContent = strength.score > 0 ? strength.label : '';
        strengthLabel.className = `strength-label ${strength.class}`;
      });

      function showError(fieldId, message) {
        const errorEl = document.getElementById(`${fieldId}-error`);
        const inputEl = document.getElementById(fieldId);
        if (errorEl) {
          errorEl.textContent = message;
          errorEl.style.display = 'flex';
        }
        if (inputEl) inputEl.classList.add('error');
      }

      function clearErrors() {
        document.querySelectorAll('.form-error').forEach(el => {
          el.style.display = 'none';
          el.textContent = '';
        });
        document.querySelectorAll('.form-input').forEach(el => el.classList.remove('error'));
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearErrors();

        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (!newPassword) {
          showError('newPassword', 'New password is required.');
          return;
        }

        const strength = OP.validator.checkStrength(newPassword);
        if (strength.score < 3) {
          showError('newPassword', 'Please choose a stronger password.');
          return;
        }

        if (newPassword !== confirmPassword) {
          showError('confirmPassword', 'Passwords do not match.');
          return;
        }

        OP.loading.show();
        submitBtn.disabled = true;
        submitBtn.classList.add('btn-loading');
        submitBtn.textContent = '';

        const result = await OP.auth.resetPassword(token, newPassword);

        OP.loading.hide();
        submitBtn.disabled = false;
        submitBtn.classList.remove('btn-loading');
        submitBtn.textContent = 'Reset Password';

        if (result.success) {
          OP.toast.show(result.message, 'success');
          setTimeout(() => window.location.href = 'signin.html', 1500);
        } else {
          showError('newPassword', result.message);
          OP.toast.show(result.message, 'error');
        }
      });
    });
  </script>
</body>
</html>
