<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Workspace — OnePlace Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="workspace-page page-transition">
    <div class="workspace-container">
      <div class="workspace-header">
        <a href="index.html" class="logo" style="margin-bottom: var(--space-6); display: inline-flex;">
          <div class="logo-mark"><i class="ph ph-chat-centered-text"></i></div>
          <div class="logo-text">
            <span class="logo-brand">OnePlace</span>
            <span class="logo-sub">Enterprise</span>
          </div>
        </a>
        <h1 class="auth-title">Select a workspace</h1>
        <p class="auth-subtitle">Choose a workspace to continue</p>
      </div>

      <div class="workspace-list" id="workspace-list">
        <!-- Workspaces injected here -->
      </div>

      <div class="workspace-actions">
        <button type="button" class="workspace-action-btn" id="create-workspace-btn">
          <i class="ph ph-plus" style="font-size: var(--text-lg);"></i>
          Create new workspace
        </button>
        <button type="button" class="workspace-action-btn" id="join-workspace-btn">
          <i class="ph ph-sign-in" style="font-size: var(--text-lg);"></i>
          Join a workspace
        </button>
      </div>
    </div>
  </div>

  <script src="../js/firebase-init.js"></script>
  <script src="../js/app.js?v=20260803-1"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!OP.nav.requireAuth()) return;

      const session = OP.auth.getSession();
      const workspaces = await OP.workspace.loadUserWorkspaces();
      const listEl = document.getElementById('workspace-list');

      if (workspaces.length === 0) {
        window.location.href = 'workspace-create.html';
        return;
      }

      // Render workspaces
      workspaces.forEach(ws => {
        const member = ws.members.find(m => m.userId === session.userId);
        const role = member ? member.role : 'Member';
        
        // Generate avatar color based on name
        const colors = ['#6366f1', '#8b5cf6', '#ec4899', '#f43f5e', '#f97316', '#eab308', '#22c55e', '#06b6d4'];
        const colorIndex = ws.name.charCodeAt(0) % colors.length;
        const bgColor = colors[colorIndex];

        const card = document.createElement('button');
        card.className = 'workspace-card';
        card.type = 'button';
        card.setAttribute('data-workspace-id', ws.id);
        
        card.innerHTML = `
          <div class="workspace-avatar" style="background: ${bgColor};">
            ${ws.name.charAt(0).toUpperCase()}
          </div>
          <div class="workspace-info">
            <div class="workspace-name">${ws.name}</div>
            <div class="workspace-domain">${ws.url}.oneplace.com</div>
          </div>
          <span class="workspace-role">${role}</span>
        `;

        card.addEventListener('click', () => {
          OP.workspace.setCurrentWorkspace(ws.id);
          OP.toast.show(`Switched to ${ws.name}`, 'success');
          setTimeout(() => {
            OP.toast.show('Redirecting to dashboard...', 'success');
            window.location.href = '../dashboard/main-dashboard.html';
          }, 500);
        });

        listEl.appendChild(card);
      });

      document.getElementById('create-workspace-btn').addEventListener('click', () => {
        window.location.href = 'workspace-create.html';
      });

      document.getElementById('join-workspace-btn').addEventListener('click', () => {
        window.location.href = 'workspace-join.html';
      });
    });
  </script>
</body>
</html>
