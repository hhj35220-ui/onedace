<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — OnePlace Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="auth-page page-transition">
    <aside class="auth-sidebar">
      <div class="auth-sidebar-content">
        <div class="logo" style="color: white;">
          <div class="logo-mark"><i class="ph ph-chat-centered-text"></i></div>
          <div class="logo-text">
            <span class="logo-brand">OnePlace</span>
            <span class="logo-sub">Enterprise</span>
          </div>
        </div>
        <div style="margin-top: auto; padding-top: var(--space-20);">
          <h1 class="auth-sidebar-headline">Forgot your password?</h1>
          <p class="auth-sidebar-subtitle">No worries, we'll help you get back in.</p>
        </div>
      </div>
      <div class="auth-sidebar-footer">
        <div class="auth-sidebar-trust">
          <i class="ph ph-shield-check"></i>
          <span>Secure password recovery</span>
        </div>
      </div>
    </aside>

    <main class="auth-main">
      <div class="auth-container">
        <div class="auth-header">
          <a href="index.html" class="logo" style="margin-bottom: var(--space-6); display: inline-flex;">
            <div class="logo-mark"><i class="ph ph-chat-centered-text"></i></div>
            <div class="logo-text">
              <span class="logo-brand">OnePlace</span>
              <span class="logo-sub">Enterprise</span>
            </div>
          </a>
          <h1 class="auth-title">Forgot your password?</h1>
          <p class="auth-subtitle">Enter your email address and we'll send you a link to reset your password.</p>
        </div>

        <form id="forgot-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email address</label>
            <div class="form-input-wrapper">
              <i class="ph ph-envelope-simple form-input-icon"></i>
              <input 
                type="email" 
                id="email" 
                name="email" 
                class="form-input with-icon" 
                placeholder="name@example.com"
                autocomplete="email"
                required
              >
            </div>
            <div class="form-error" id="email-error" style="display: none;"></div>
          </div>

          <button type="submit" class="btn btn-primary btn-full btn-lg" id="submit-btn">
            Send Reset Link
          </button>
        </form>

        <div class="auth-footer">
          <a href="signin.html" style="display: inline-flex; align-items: center; gap: var(--space-2);">
            <i class="ph ph-arrow-left"></i> Back to sign in
          </a>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/app.js?v=20260803-1"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('forgot-form');
      const emailInput = document.getElementById('email');
      const submitBtn = document.getElementById('submit-btn');

      function showError(fieldId, message) {
        const errorEl = document.getElementById(`${fieldId}-error`);
        const inputEl = document.getElementById(fieldId);
        if (errorEl) {
          errorEl.textContent = message;
          errorEl.style.display = 'flex';
        }
        if (inputEl) inputEl.classList.add('error');
      }

      function clearErrors() {
        document.querySelectorAll('.form-error').forEach(el => {
          el.style.display = 'none';
          el.textContent = '';
        });
        document.querySelectorAll('.form-input').forEach(el => el.classList.remove('error'));
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearErrors();

        const email = emailInput.value.trim();
        if (!email) {
          showError('email', 'Email is required.');
          return;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          showError('email', 'Please enter a valid email address.');
          return;
        }

        OP.loading.show();
        submitBtn.disabled = true;
        submitBtn.classList.add('btn-loading');
        submitBtn.textContent = '';

        const result = await OP.auth.requestPasswordReset(email);

        OP.loading.hide();
        submitBtn.disabled = false;
        submitBtn.classList.remove('btn-loading');
        submitBtn.textContent = 'Send Reset Link';

        if (result.success) {
          OP.toast.show(result.message || 'Reset instructions generated.', 'success');

          if (result.token) {
            const simulatedDiv = document.createElement('div');
            simulatedDiv.className = 'verify-simulated animate-fadeIn';
            simulatedDiv.innerHTML = `
              <div class="verify-simulated-header">
                <i class="ph ph-envelope-simple"></i>
                Simulated Email
              </div>
              <div class="verify-simulated-box">
                <div class="verify-simulated-from">From: noreply@oneplace.com</div>
                <div class="verify-simulated-subject">Reset your OnePlace password</div>
                <div class="verify-simulated-body">
                  <p>Click the link below to reset your password:</p>
                  <p style="margin-top: var(--space-2);">
                    <a href="reset-password.html?token=${encodeURIComponent(result.token)}" style="color: var(--primary-600); word-break: break-all;">
                      Reset Password
                    </a>
                  </p>
                  <p style="margin-top: var(--space-2); color: var(--gray-400); font-size: var(--text-xs);">
                    This link expires in 1 hour.
                  </p>
                </div>
              </div>
            `;
            form.style.display = 'none';
            document.querySelector('.auth-header').insertAdjacentElement('afterend', simulatedDiv);
          }
        } else {
          showError('email', result.message);
          OP.toast.show(result.message, 'error');
        }
      });
    });
  </script>
</body>
</html>
