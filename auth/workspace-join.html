<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Workspace — OnePlace Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="workspace-page page-transition">
    <div class="workspace-container">
      <div class="workspace-header">
        <a href="index.html" class="logo" style="margin-bottom: var(--space-6); display: inline-flex;">
          <div class="logo-mark"><i class="ph ph-chat-centered-text"></i></div>
          <div class="logo-text">
            <span class="logo-brand">OnePlace</span>
            <span class="logo-sub">Enterprise</span>
          </div>
        </a>
        <h1 class="auth-title">Join a workspace</h1>
        <p class="auth-subtitle">Enter the invite code or workspace URL to join an existing workspace</p>
      </div>

      <!-- Tabs -->
      <div style="display: flex; gap: var(--space-1); margin-bottom: var(--space-6); background: var(--gray-100); padding: var(--space-1); border-radius: var(--radius-lg);">
        <button type="button" class="btn btn-sm" id="tab-invite" style="flex: 1; background: var(--gray-0); box-shadow: var(--shadow-sm);">Invite Code</button>
        <button type="button" class="btn btn-ghost btn-sm" id="tab-url" style="flex: 1;">Workspace URL</button>
      </div>

      <!-- Invite Code Form -->
      <form id="join-invite-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="inviteCode">Invite code</label>
          <div class="form-input-wrapper">
            <i class="ph ph-ticket form-input-icon"></i>
            <input 
              type="text" 
              id="inviteCode" 
              name="inviteCode" 
              class="form-input with-icon" 
              placeholder="Enter invite code"
              style="text-transform: uppercase;"
              required
            >
          </div>
          <div class="form-error" id="inviteCode-error" style="display: none;"></div>
          <p class="form-hint">e.g. AB12-CD34-EF56</p>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="submit-invite-btn">
          Join Workspace
        </button>
      </form>

      <!-- Workspace URL Form (hidden by default) -->
      <form id="join-url-form" novalidate style="display: none;">
        <div class="form-group">
          <label class="form-label" for="workspaceUrlJoin">Workspace URL</label>
          <div class="form-input-wrapper">
            <span style="position: absolute; left: var(--space-4); top: 50%; transform: translateY(-50%); color: var(--gray-400); font-size: var(--text-sm); pointer-events: none;">https://</span>
            <input 
              type="text" 
              id="workspaceUrlJoin" 
              name="workspaceUrlJoin" 
              class="form-input" 
              style="padding-left: 64px;"
              placeholder="workspace-name"
              required
            >
            <span style="position: absolute; right: var(--space-4); top: 50%; transform: translateY(-50%); color: var(--gray-400); font-size: var(--text-sm); pointer-events: none;">.oneplace.com</span>
          </div>
          <div class="form-error" id="workspaceUrlJoin-error" style="display: none;"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="submit-url-btn">
          Join Workspace
        </button>
      </form>

      <div style="text-align: center; margin-top: var(--space-6);">
        <a href="workspace-select.html" style="font-size: var(--text-sm); display: inline-flex; align-items: center; gap: var(--space-2);">
          <i class="ph ph-arrow-left"></i> Back to workspace selection
        </a>
      </div>
    </div>
  </div>

  <script src="../js/firebase-init.js"></script>
  <script src="../js/app.js?v=20260803-1"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!OP.nav.requireAuth()) return;

      const tabInvite = document.getElementById('tab-invite');
      const tabUrl = document.getElementById('tab-url');
      const inviteForm = document.getElementById('join-invite-form');
      const urlForm = document.getElementById('join-url-form');

      function switchTab(tab) {
        if (tab === 'invite') {
          tabInvite.style.background = 'var(--gray-0)';
          tabInvite.style.boxShadow = 'var(--shadow-sm)';
          tabUrl.style.background = 'transparent';
          tabUrl.style.boxShadow = 'none';
          inviteForm.style.display = 'block';
          urlForm.style.display = 'none';
        } else {
          tabUrl.style.background = 'var(--gray-0)';
          tabUrl.style.boxShadow = 'var(--shadow-sm)';
          tabInvite.style.background = 'transparent';
          tabInvite.style.boxShadow = 'none';
          urlForm.style.display = 'block';
          inviteForm.style.display = 'none';
        }
      }

      tabInvite.addEventListener('click', () => switchTab('invite'));
      tabUrl.addEventListener('click', () => switchTab('url'));

      function showError(formId, fieldId, message) {
        const errorEl = document.getElementById(`${fieldId}-error`);
        const inputEl = document.getElementById(fieldId);
        if (errorEl) {
          errorEl.textContent = message;
          errorEl.style.display = 'flex';
        }
        if (inputEl) inputEl.classList.add('error');
      }

      function clearErrors() {
        document.querySelectorAll('.form-error').forEach(el => {
          el.style.display = 'none';
          el.textContent = '';
        });
        document.querySelectorAll('.form-input').forEach(el => el.classList.remove('error'));
      }

      // Invite code form
      inviteForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearErrors();

        const code = document.getElementById('inviteCode').value.trim().toUpperCase().replace(/-/g, '');
        if (!code) {
          showError('join-invite', 'inviteCode', 'Invite code is required.');
          return;
        }

        const submitBtn = document.getElementById('submit-invite-btn');
        OP.loading.show();
        submitBtn.disabled = true;
        submitBtn.classList.add('btn-loading');
        submitBtn.textContent = '';

        await new Promise(r => setTimeout(r, 800));

        const result = await OP.workspace.joinWorkspace(code);

        OP.loading.hide();
        submitBtn.disabled = false;
        submitBtn.classList.remove('btn-loading');
        submitBtn.textContent = 'Join Workspace';

        if (result.success) {
          OP.toast.show(result.message, 'success');
          setTimeout(() => {
            window.location.href = 'profile-setup.html';
          }, 500);
        } else {
          showError('join-invite', 'inviteCode', result.message);
          OP.toast.show(result.message, 'error');
        }
      });

      // URL form
      urlForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearErrors();

        const url = document.getElementById('workspaceUrlJoin').value.trim().toLowerCase();
        if (!url) {
          showError('join-url', 'workspaceUrlJoin', 'Workspace URL is required.');
          return;
        }

        // Find workspace by URL
        const workspaces = OP.workspace.getWorkspaces();
        const target = workspaces.find(w => w.url.toLowerCase() === url);
        
        if (!target) {
          showError('join-url', 'workspaceUrlJoin', 'Workspace not found. Please check the URL.');
          return;
        }

        const submitBtn = document.getElementById('submit-url-btn');
        OP.loading.show();
        submitBtn.disabled = true;
        submitBtn.classList.add('btn-loading');
        submitBtn.textContent = '';

        await new Promise(r => setTimeout(r, 800));

        const result = await OP.workspace.joinWorkspace(target.id.slice(0, 8).toUpperCase());

        OP.loading.hide();
        submitBtn.disabled = false;
        submitBtn.classList.remove('btn-loading');
        submitBtn.textContent = 'Join Workspace';

        if (result.success) {
          OP.toast.show(result.message, 'success');
          setTimeout(() => {
            window.location.href = 'profile-setup.html';
          }, 500);
        } else {
          showError('join-url', 'workspaceUrlJoin', result.message);
          OP.toast.show(result.message, 'error');
        }
      });
    });
  </script>
</body>
</html>
