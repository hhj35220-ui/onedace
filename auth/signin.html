<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      const storageKey = 'op_theme';
      const savedTheme = localStorage.getItem(storageKey);
      const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      const theme = (savedTheme === 'system') ? systemTheme : (savedTheme || systemTheme);
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.style.colorScheme = theme;
      if (!savedTheme) localStorage.setItem(storageKey, theme);
    })();
  </script>
  <title>Sign In — OnePlace Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="auth-page page-transition">
    <!-- Left Sidebar -->
    <aside class="auth-sidebar">
      <div class="auth-sidebar-content">
        <div class="logo" style="color: white;">
          <div class="logo-mark"><i class="ph ph-chat-centered-text"></i></div>
          <div class="logo-text">
            <span class="logo-brand">OnePlace</span>
            <span class="logo-sub">Enterprise</span>
          </div>
        </div>
        
        <div style="margin-top: auto; padding-top: var(--space-20);">
          <h1 class="auth-sidebar-headline">Welcome back</h1>
          <p class="auth-sidebar-subtitle">Sign in to continue to your account</p>
        </div>
      </div>
      
      <div class="auth-sidebar-footer">
        <div class="auth-sidebar-trust">
          <i class="ph ph-shield-check"></i>
          <span>Enterprise-grade security</span>
        </div>
      </div>
    </aside>

    <!-- Right Main -->
    <main class="auth-main">
      <div class="auth-container">
        <div class="auth-header">
          <a href="index.html" class="logo" style="margin-bottom: var(--space-6); display: inline-flex;">
            <div class="logo-mark"><i class="ph ph-chat-centered-text"></i></div>
            <div class="logo-text">
              <span class="logo-brand">OnePlace</span>
              <span class="logo-sub">Enterprise</span>
            </div>
          </a>
          <h1 class="auth-title">Welcome back</h1>
          <p class="auth-subtitle">Sign in to continue to your account</p>
        </div>

        <form id="signin-form" novalidate>
          <!-- Email -->
          <div class="form-group">
            <label class="form-label" for="email">Email address</label>
            <div class="form-input-wrapper">
              <i class="ph ph-envelope-simple form-input-icon"></i>
              <input 
                type="email" 
                id="email" 
                name="email" 
                class="form-input with-icon" 
                placeholder="name@example.com"
                autocomplete="email"
                required
              >
            </div>
            <div class="form-error" id="email-error" style="display: none;"></div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="form-input-wrapper">
              <i class="ph ph-lock-key form-input-icon"></i>
              <input 
                type="password" 
                id="password" 
                name="password" 
                class="form-input with-icon with-icon-right" 
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              >
              <button type="button" class="form-input-toggle" id="toggle-password" aria-label="Toggle password visibility">
                <i class="ph ph-eye"></i>
              </button>
            </div>
            <div class="form-error" id="password-error" style="display: none;"></div>
          </div>

          <!-- Remember Me & Forgot Password -->
          <div class="flex justify-between items-center" style="margin-bottom: var(--space-6);">
            <label class="checkbox-wrapper">
              <input type="checkbox" id="remember-me" name="rememberMe">
              <span class="checkbox-label">Remember me</span>
            </label>
            <a href="forgot-password.html" style="font-size: var(--text-sm); font-weight: var(--font-medium);">Forgot password?</a>
          </div>

          <!-- Submit -->
          <button type="submit" class="btn btn-primary btn-full btn-lg" id="submit-btn">
            Sign In
          </button>
        </form>

        <div class="auth-footer">
          Don't have an account? <a href="signup.html">Sign up</a>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Redirect if authenticated
      if (OP.auth.isAuthenticated()) {
        const workspaces = OP.workspace.getUserWorkspaces();
        window.location.href = workspaces.length > 0 ? 'workspace-select.html' : 'workspace-create.html';
        return;
      }

      const form = document.getElementById('signin-form');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const toggleBtn = document.getElementById('toggle-password');
      const submitBtn = document.getElementById('submit-btn');
      let isSubmitting = false;

      // Toggle password visibility
      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        toggleBtn.innerHTML = isPassword ? '<i class="ph ph-eye-slash"></i>' : '<i class="ph ph-eye"></i>';
      });

      // Form validation
      function showError(fieldId, message) {
        const errorEl = document.getElementById(`${fieldId}-error`);
        const inputEl = document.getElementById(fieldId);
        if (errorEl) {
          errorEl.textContent = message;
          errorEl.style.display = 'flex';
        }
        if (inputEl) inputEl.classList.add('error');
      }

      function clearErrors() {
        document.querySelectorAll('.form-error').forEach(el => {
          el.style.display = 'none';
          el.textContent = '';
        });
        document.querySelectorAll('.form-input').forEach(el => el.classList.remove('error'));
      }

      function validate() {
        clearErrors();
        let valid = true;

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email) {
          showError('email', 'Email is required.');
          valid = false;
        } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          showError('email', 'Please enter a valid email address.');
          valid = false;
        }

        if (!password) {
          showError('password', 'Password is required.');
          valid = false;
        }

        return valid;
      }

      // Form submission
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (isSubmitting || !validate()) return;

        isSubmitting = true;
        OP.loading.show();
        submitBtn.disabled = true;
        submitBtn.classList.add('btn-loading');
        submitBtn.textContent = '';

        try {
          const result = await OP.auth.signIn(
            emailInput.value.trim(),
            passwordInput.value,
            document.getElementById('remember-me').checked
          );

          if (result.success) {
            OP.toast.show(result.message, 'success');
            const workspaces = OP.workspace.getUserWorkspaces();
            setTimeout(() => {
              window.location.href = workspaces.length > 0 ? 'workspace-select.html' : 'workspace-create.html';
            }, 500);
          } else {
            showError('email', result.message);
            OP.toast.show(result.message, 'error');
          }
        } finally {
          OP.loading.hide();
          isSubmitting = false;
          submitBtn.disabled = false;
          submitBtn.classList.remove('btn-loading');
          submitBtn.textContent = 'Sign In';
        }
      });

      // Pre-fill remembered email
      const remembered = localStorage.getItem('op_remembered_email');
      if (remembered) {
        emailInput.value = remembered;
        document.getElementById('remember-me').checked = true;
      }
    });
  </script>
</body>
</html>
