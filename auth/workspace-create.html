<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Workspace — OnePlace Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="workspace-page page-transition">
    <div class="workspace-container">
      <div class="workspace-header">
        <a href="index.html" class="logo" style="margin-bottom: var(--space-6); display: inline-flex;">
          <div class="logo-mark"><i class="ph ph-chat-centered-text"></i></div>
          <div class="logo-text">
            <span class="logo-brand">OnePlace</span>
            <span class="logo-sub">Enterprise</span>
          </div>
        </a>
        <h1 class="auth-title">Create a new workspace</h1>
        <p class="auth-subtitle">Set up your workspace to get started</p>
      </div>

      <form id="create-workspace-form" novalidate>
        <!-- Workspace Name -->
        <div class="form-group">
          <label class="form-label" for="workspaceName">Workspace name</label>
          <input 
            type="text" 
            id="workspaceName" 
            name="workspaceName" 
            class="form-input" 
            placeholder="Enter workspace name"
            required
          >
          <div class="form-error" id="workspaceName-error" style="display: none;"></div>
        </div>

        <!-- Workspace URL -->
        <div class="form-group">
          <label class="form-label" for="workspaceUrl">Workspace URL</label>
          <div class="form-input-wrapper">
            <span style="position: absolute; left: var(--space-4); top: 50%; transform: translateY(-50%); color: var(--gray-400); font-size: var(--text-sm); pointer-events: none;">https://</span>
            <input 
              type="text" 
              id="workspaceUrl" 
              name="workspaceUrl" 
              class="form-input" 
              style="padding-left: 64px;"
              placeholder="yourworkspace"
              required
            >
            <span style="position: absolute; right: var(--space-4); top: 50%; transform: translateY(-50%); color: var(--gray-400); font-size: var(--text-sm); pointer-events: none;">.oneplace.com</span>
          </div>
          <div class="form-error" id="workspaceUrl-error" style="display: none;"></div>
        </div>

        <!-- Workspace Size -->
        <div class="form-group">
          <label class="form-label" for="workspaceSize">Workspace size</label>
          <select id="workspaceSize" name="workspaceSize" class="form-input form-select" required>
            <option value="" disabled selected>Select team size</option>
            <option value="1-10">1-10 people</option>
            <option value="11-50">11-50 people</option>
            <option value="51-200">51-200 people</option>
            <option value="201-500">201-500 people</option>
            <option value="500+">500+ people</option>
          </select>
          <div class="form-error" id="workspaceSize-error" style="display: none;"></div>
        </div>

        <!-- Industry -->
        <div class="form-group">
          <label class="form-label" for="industry">Industry (optional)</label>
          <select id="industry" name="industry" class="form-input form-select">
            <option value="" disabled selected>Select industry</option>
            <option value="technology">Technology</option>
            <option value="healthcare">Healthcare</option>
            <option value="finance">Finance</option>
            <option value="education">Education</option>
            <option value="retail">Retail</option>
            <option value="manufacturing">Manufacturing</option>
            <option value="other">Other</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="submit-btn">
          Create Workspace
        </button>
      </form>

      <p style="text-align: center; margin-top: var(--space-6); font-size: var(--text-sm); color: var(--gray-500);">
        You can change these settings later.
      </p>

      <div style="text-align: center; margin-top: var(--space-4);">
        <a href="workspace-select.html" style="font-size: var(--text-sm); display: inline-flex; align-items: center; gap: var(--space-2);">
          <i class="ph ph-arrow-left"></i> Back to workspace selection
        </a>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!OP.nav.requireAuth()) return;

      const form = document.getElementById('create-workspace-form');
      const nameInput = document.getElementById('workspaceName');
      const urlInput = document.getElementById('workspaceUrl');
      const sizeInput = document.getElementById('workspaceSize');
      const industryInput = document.getElementById('industry');
      const submitBtn = document.getElementById('submit-btn');

      // Auto-generate URL from name
      nameInput.addEventListener('input', () => {
        if (!urlInput.dataset.userEdited) {
          const slug = nameInput.value.toLowerCase().replace(/[^a-z0-9-]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
          urlInput.value = slug;
        }
      });

      urlInput.addEventListener('input', () => {
        urlInput.dataset.userEdited = 'true';
      });

      function showError(fieldId, message) {
        const errorEl = document.getElementById(`${fieldId}-error`);
        const inputEl = document.getElementById(fieldId);
        if (errorEl) {
          errorEl.textContent = message;
          errorEl.style.display = 'flex';
        }
        if (inputEl) inputEl.classList.add('error');
      }

      function clearErrors() {
        document.querySelectorAll('.form-error').forEach(el => {
          el.style.display = 'none';
          el.textContent = '';
        });
        document.querySelectorAll('.form-input').forEach(el => el.classList.remove('error'));
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearErrors();

        const name = nameInput.value.trim();
        const url = urlInput.value.trim();
        const size = sizeInput.value;
        const industry = industryInput.value;

        if (!name) {
          showError('workspaceName', 'Workspace name is required.');
          return;
        }

        if (!url) {
          showError('workspaceUrl', 'Workspace URL is required.');
          return;
        }

        if (!/^[a-zA-Z0-9-]+$/.test(url)) {
          showError('workspaceUrl', 'Only letters, numbers, and hyphens allowed.');
          return;
        }

        if (!size) {
          showError('workspaceSize', 'Please select a team size.');
          return;
        }

        OP.loading.show();
        submitBtn.disabled = true;
        submitBtn.classList.add('btn-loading');
        submitBtn.textContent = '';

        await new Promise(r => setTimeout(r, 1000));

        const result = OP.workspace.createWorkspace(name, url, size, industry);

        OP.loading.hide();
        submitBtn.disabled = false;
        submitBtn.classList.remove('btn-loading');
        submitBtn.textContent = 'Create Workspace';

        if (result.success) {
          OP.toast.show(result.message, 'success');
          setTimeout(() => {
            window.location.href = 'profile-setup.html';
          }, 500);
        } else {
          showError('workspaceUrl', result.message);
          OP.toast.show(result.message, 'error');
        }
      });
    });
  </script>
</body>
</html>
