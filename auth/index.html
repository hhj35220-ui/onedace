<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnePlace Enterprise — All your conversations. One powerful platform.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="landing-page page-transition">
    <!-- Left Sidebar -->
    <aside class="landing-sidebar">
      <div class="landing-sidebar-header">
        <div class="logo" style="color: white;">
          <div class="logo-mark"><i class="ph ph-chat-centered-text"></i></div>
          <div class="logo-text">
            <span class="logo-brand">OnePlace</span>
            <span class="logo-sub">Enterprise</span>
          </div>
        </div>
        <button class="menu-toggle" aria-label="Open menu">
          <i class="ph ph-list"></i>
        </button>
      </div>
      
      <div class="landing-sidebar-content">
        <h1 class="landing-headline">All your conversations. One powerful platform.</h1>
        <p class="landing-description">Connect Gmail, WhatsApp, Instagram, TikTok, X (Twitter), LinkedIn and more. Manage customers, teams and workflows from one place.</p>
        
        <div class="landing-integrations">
          <div class="landing-integration-icon" title="Gmail"><i class="ph ph-envelope-simple"></i></div>
          <div class="landing-integration-icon" title="WhatsApp"><i class="ph ph-chat-circle-text"></i></div>
          <div class="landing-integration-icon" title="Instagram"><i class="ph ph-camera"></i></div>
          <div class="landing-integration-icon" title="TikTok"><i class="ph ph-tiktok-logo"></i></div>
          <div class="landing-integration-icon" title="X (Twitter)"><i class="ph ph-x-logo"></i></div>
          <div class="landing-integration-icon" title="LinkedIn"><i class="ph ph-linkedin-logo"></i></div>
        </div>
        
        <div class="landing-actions animate-fadeInUp">
          <a href="signup.html" class="btn btn-primary btn-lg">
            Get Started Free
          </a>
          <a href="signin.html" class="btn btn-secondary btn-lg">
            Sign In
          </a>
        </div>
      </div>
      
      <div class="landing-trust">
        <p class="landing-trust-text">Trusted by teams worldwide</p>
        <div class="landing-trust-logos">
          <span class="trust-logo trust-logo-google" aria-label="Google">G</span>
          <span class="trust-logo trust-logo-meta" aria-label="Meta">∞</span>
          <span class="trust-logo trust-logo-microsoft" aria-label="Microsoft">
            <span class="ms-square"></span>
            <span class="ms-square"></span>
            <span class="ms-square"></span>
            <span class="ms-square"></span>
          </span>
          <span class="trust-logo trust-logo-amazon" aria-label="Amazon">a</span>
          <span class="trust-logo trust-logo-adobe" aria-label="Adobe">A</span>
        </div>
      </div>
    </aside>

    <!-- Right Main -->
    <main class="landing-main">
      <nav class="landing-nav" aria-label="Main navigation">
        <a href="signin.html" class="landing-nav-btn signin">Sign In</a>
        <a href="signup.html" class="landing-nav-btn getstarted">Get Started Free</a>
      </nav>
    </main>
  </div>

  <script src="../js/app.js?v=20260803-1"></script>
  <script>
    // Check if already authenticated
    document.addEventListener('DOMContentLoaded', () => {
      if (OP.auth.isAuthenticated()) {
        window.location.href = '../dashboard/main-dashboard.html';
      }
    });
  </script>
</body>
</html>
